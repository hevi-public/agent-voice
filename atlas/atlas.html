<title>agent-voice Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #edf0ee; --surface: #f8faf9; --panel: #ffffff; --ink: #15212b; --muted: #5a6772;
  --line: #c9d2d4; --faint: #dde4e4; --pkg: #e2e8e6; --signal: #0a7c74; --signal-soft: #cde8e3;
  --edge: #6d7a84; --halo: #edf0ee;
  --l-security: #c2410c; --l-privacy: #a21caf; --l-network: #1d4ed8; --l-audio: #7c3aed; --l-files: #a16207;
  --l-process: #475569; --l-resilience: #4d7c0f; --l-performance: #0e7490; --l-agent: #4338ca; --l-coverage: #0a7c74;
  --cov-low: #c2410c; --cov-mid: #b7791f; --cov-high: #2f855a;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1417; --surface: #121a1e; --panel: #162025; --ink: #e3eaec; --muted: #93a2ab;
    --line: #2b3940; --faint: #1c272d; --pkg: #111a1e; --signal: #43c7b8; --signal-soft: #15393a;
    --edge: #7d8c95; --halo: #0e1417;
    --l-security: #fb8a4b; --l-privacy: #e879f9; --l-network: #7aa2ff; --l-audio: #b69cff; --l-files: #e0b04a;
    --l-process: #a3b3c2; --l-resilience: #9ccc3f; --l-performance: #3cc6de; --l-agent: #9d97ff; --l-coverage: #43c7b8;
    --cov-low: #fb8a4b; --cov-mid: #e0b04a; --cov-high: #5fd08f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1417; --surface: #121a1e; --panel: #162025; --ink: #e3eaec; --muted: #93a2ab;
  --line: #2b3940; --faint: #1c272d; --pkg: #111a1e; --signal: #43c7b8; --signal-soft: #15393a;
  --edge: #7d8c95; --halo: #0e1417;
  --l-security: #fb8a4b; --l-privacy: #e879f9; --l-network: #7aa2ff; --l-audio: #b69cff; --l-files: #e0b04a;
  --l-process: #a3b3c2; --l-resilience: #9ccc3f; --l-performance: #3cc6de; --l-agent: #9d97ff; --l-coverage: #43c7b8;
  --cov-low: #fb8a4b; --cov-mid: #e0b04a; --cov-high: #5fd08f;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--ui); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; color: var(--signal); }
.brand h1 { font: 700 20px/1 var(--display); letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.brand small { color: var(--muted); font: 12px var(--mono); }
.crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 4px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.crumbs button:last-child { color: var(--ink); font-weight: 600; }
.crumbs button:hover { background: var(--faint); }
.crumbs span { color: var(--line); }
.search { position: relative; }
.search input { width: 220px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

.toolbar { display: flex; align-items: center; gap: 10px 18px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lenses { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
.tours { margin-left: auto; position: relative; }
.tours > button { border: 1px solid var(--signal); color: var(--signal); background: var(--panel); border-radius: 7px; padding: 5px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.18); padding: 6px; width: min(340px, 90vw); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--faint); }
.menu small { display: block; color: var(--muted); font-size: 12px; }

.stage { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; overflow: hidden; background: var(--ground); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
.inspector { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px 28px; }

/* map */
#map text { font-family: var(--ui); fill: var(--ink); }
.ext rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.ext .t { font: 700 24px var(--display); }
.ext .s { font: 14px var(--ui); fill: var(--muted); }
.pkg-box { fill: var(--pkg); stroke: var(--line); stroke-width: 2; }
.pkg-face { transition: opacity .45s; }
.pkg-face .t { font: 700 64px var(--display); letter-spacing: -0.02em; }
.pkg-face .s { font: 22px var(--ui); fill: var(--muted); }
.pkg-tag { font: 600 16px var(--mono); fill: var(--muted); letter-spacing: .04em; transition: opacity .45s; }
.mod rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.mod .t { font: 700 21px var(--display); }
.mod .f { font: 11px var(--mono); fill: var(--muted); }
.mod .sum { font: 14.5px var(--ui); fill: var(--muted); transition: opacity .45s; }
.mod .badge { font: 600 12px var(--mono); }
.row rect { fill: var(--surface); stroke: transparent; }
.row text { font: 12px var(--mono); transition: opacity .45s; }
.row.class rect { fill: var(--faint); }
.row.class text { font-weight: 500; }
.row .cov { transition: opacity .45s; }
.dots circle { stroke: var(--panel); stroke-width: 1; }
[data-level="0"] .mod, [data-level="0"] .edge-labels-l2 { opacity: 0.16; }
[data-level="0"] .mod .sum, [data-level="0"] .row text, [data-level="0"] .mod .badges { opacity: 0; }
[data-level="1"] .pkg-face, [data-level="2"] .pkg-face { opacity: 0; pointer-events: none; }
[data-level="0"] .pkg-tag { opacity: 0; }
[data-level="1"] .row text { opacity: 0; }
[data-level="1"] .row rect { opacity: .55; }
[data-level="2"] .mod .sum:not(.keep) { opacity: 0; }
.mod, .row, .ext, .pkg-face { transition: opacity .35s; }
.node { cursor: pointer; }
.node:hover rect.box, .node:hover > rect { stroke: var(--signal); }
.dim { opacity: 0.22 !important; }
.sel > rect, .sel rect.box { stroke: var(--signal) !important; stroke-width: 2.5 !important; }
.row.sel rect { fill: var(--signal-soft); }
.hl > rect, .hl rect.box { stroke: var(--signal); stroke-width: 2; }
.row.hl rect { fill: color-mix(in srgb, var(--signal) 16%, var(--surface)); }
.lens-hit > rect, .lens-hit rect.box { stroke: var(--lens, var(--signal)); stroke-width: 2; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; opacity: .75; }
.edge.io { stroke: var(--signal); stroke-dasharray: 7 5; }
.edge.spawn, .edge.socket { stroke: var(--l-process); stroke-dasharray: 2 5; stroke-linecap: round; stroke-width: 2; }
.edge.active { stroke-width: 2.4; opacity: 1; stroke: var(--signal); stroke-dasharray: 9 7; animation: flow 1.1s linear infinite; }
.edge.agg { stroke-width: 2.2; }
.edge-label { font: 11px var(--ui); fill: var(--muted); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.edge-label.big { font-size: 17px; }
.edge-label.mid { font-size: 13px; }
.edge-label.active { fill: var(--ink); font-weight: 600; }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .edge.active { animation: none; } .mod, .row, .ext, .pkg-face, .row text, .mod .sum { transition: none; } }

/* map chrome */
.zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
.legend { position: absolute; top: 12px; left: 12px; display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 7px; font-size: 11.5px; color: var(--muted); max-width: calc(100% - 70px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }

.guide { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 640px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.14); padding: 12px 14px; display: grid; gap: 8px; }
.guide-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--signal-soft); color: var(--signal); white-space: nowrap; }
.guide-title { font: 600 14px var(--ui); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guide-text { font-size: 14px; line-height: 1.55; max-height: 30vh; overflow-y: auto; white-space: pre-wrap; }
.guide-text code, .inspector code { font: 12.5px var(--mono); background: var(--faint); padding: 0 4px; border-radius: 3px; }
.guide-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--panel); }
.stepno { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ask { display: flex; gap: 6px; }
.ask input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.ask .speak { display: flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; color: var(--muted); }
.ask select { padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; font: inherit; }
.follow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pulse.on { background: var(--signal); box-shadow: 0 0 0 0 var(--signal); animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.iconbtn { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 4px; }

/* inspector */
.eyebrow { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.inspector h2 { font: 700 24px/1.15 var(--display); margin: 4px 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
.inspector h2.code { font: 600 19px/1.3 var(--mono); }
.inspector h3 { font: 600 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.inspector p { margin: 6px 0; max-width: 62ch; }
.src { font: 12px var(--mono); color: var(--signal); text-decoration: none; }
.src:hover { text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list li { display: flex; gap: 8px; align-items: baseline; }
.list button.link { border: 0; background: none; padding: 1px 0; cursor: pointer; color: var(--ink); font: 12.5px var(--mono); text-align: left; }
.list button.link:hover { color: var(--signal); text-decoration: underline; }
.list .via { color: var(--muted); font-size: 12px; }
.kind { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; background: var(--faint); color: var(--muted); flex: none; }
.kind.io, .kind.network, .kind.socket { background: var(--signal-soft); color: var(--signal); }
.meter { display: inline-flex; align-items: center; gap: 8px; font: 12px var(--mono); }
.meter b { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--faint); position: relative; overflow: hidden; }
.meter b i { position: absolute; inset: 0 auto 0 0; background: var(--cm, var(--cov-high)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 12px 0; }
.stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.start { display: grid; gap: 6px; }
.start button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.start button:hover { border-color: var(--signal); }
.start small { display: block; color: var(--muted); font-size: 12px; }
pre.cmd { font: 12px/1.5 var(--mono); background: var(--faint); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 6px 0; }
.history li { display: block; font-size: 12.5px; }
.history code { margin-right: 6px; }
.note { color: var(--muted); font-size: 12.5px; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .tours { margin-left: 0; }
  .search input { width: 160px; }
  .legend { display: none; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true"><path d="M1 11h3M6 6v10M10 2v18M14 7v8M18 4v14M22 8v6M25 11h2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <h1>agent-voice Atlas</h1>
      <small id="commit"></small>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="search">
      <label class="label" for="find" hidden>Find</label>
      <input id="find" list="nodelist" placeholder="Find a function…" autocomplete="off">
      <datalist id="nodelist"></datalist>
    </div>
  </header>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Detail level" id="levels">
      <button data-level="0">System</button><button data-level="1">Modules</button><button data-level="2">Functions</button>
    </div>
    <div class="lenses" id="lenses" role="group" aria-label="Highlight"><span class="label">Highlight</span></div>
    <div class="tours">
      <button id="toursBtn" aria-haspopup="true" aria-expanded="false">Questions ▾</button>
      <div class="menu" id="toursMenu" hidden></div>
    </div>
  </div>
  <main class="stage">
    <section class="mapwrap" aria-label="Architecture map">
      <svg id="map" role="img" aria-label="agent-voice architecture: agents on the left, the package's modules in the middle, the operating system, files and libraries on the right"></svg>
      <div class="legend" aria-hidden="true">
        <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--edge)" stroke-width="1.6"/></svg>call</span>
        <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--signal)" stroke-width="1.6" stroke-dasharray="7 5"/></svg>I/O seam</span>
        <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="var(--l-process)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/></svg>other process · socket</span>
      </div>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Show everything">⤢</button>
      </div>
      <div class="guide" id="guide">
        <div class="guide-head">
          <span class="who" id="who">Guide</span>
          <span class="guide-title" id="gtitle">Start anywhere</span>
          <label class="follow" id="followWrap" hidden><span class="pulse" id="pulse"></span><input type="checkbox" id="follow" checked> Follow agent</label>
          <button class="iconbtn" id="gclose" aria-label="Clear the guide">×</button>
        </div>
        <div class="guide-text" id="gtext">Click anything to inspect it, scroll to zoom from the system down to single functions, or pick a question to take a guided tour.</div>
        <div class="guide-controls" id="gcontrols" hidden>
          <button class="btn" id="prev" aria-label="Previous step">◀</button>
          <span class="stepno" id="stepno"></span>
          <button class="btn" id="next" aria-label="Next step">▶</button>
          <button class="btn" id="play">Play</button>
        </div>
        <form class="ask" id="askForm" hidden>
          <input id="ask" placeholder="Ask about the code — Claude walks you through it" autocomplete="off">
          <select id="askAgent" aria-label="Who answers" hidden></select>
          <label class="speak" id="speakWrap" title="The agent narrates each step aloud with agent-voice" hidden><input type="checkbox" id="speak"> Speak</label>
          <button class="btn primary" id="askBtn" type="submit">Ask</button>
          <button class="btn" id="stopBtn" type="button" hidden>Stop</button>
        </form>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </main>
</div>

<script>
(async () => {
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ------------------------------------------------------------------ model
let M;
try {
  M = await (await fetch("model.json", { cache: "no-store" })).json();
} catch (e) {
  $("gtext").textContent = "The map's data (model.json) could not be loaded.";
  return;
}
const byId = new Map(M.nodes.map((n) => [n.id, n]));
const LENS = new Map(M.lenses.map((l) => [l.id, l]));
LENS.set("coverage", { id: "coverage", label: "Test coverage", q: "How well is each function tested?" });
const TOUR = new Map(M.tours.map((t) => [t.id, t]));
$("commit").textContent = "@" + M.commit;
const functions = M.nodes.filter((n) => n.kind === "function" || n.kind === "class");
const modules = M.nodes.filter((n) => n.kind === "module");
const externals = M.nodes.filter((n) => n.kind === "external");
const out = new Map(), inn = new Map();
for (const e of M.edges) {
  (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);
  (inn.get(e.to) || inn.set(e.to, []).get(e.to)).push(e);
}
const moduleOf = (id) => { const n = byId.get(id); return !n ? null : n.kind === "module" ? id : n.module || null; };

// ------------------------------------------------------------------ layout (world units)
const W = 1800, H = 1120;
const PKG = { x: 270, y: 60, w: 1195, h: 1030 };
const COLW = 214, COLX = [292, 524, 756, 988, 1220];
const HEAD = 72, ROW = 26;
const box = new Map();       // id -> {x,y,w,h}
const colOf = { cli: 0, hooks: 1, skill: 2, skillmd: 2, init: 2, server: 3, speech: 4 };
{
  const left = externals.filter((n) => n.side === "left"), right = externals.filter((n) => n.side === "right");
  left.forEach((n, i) => box.set(n.id, { x: 36, y: 140 + i * 152, w: 196, h: 120 }));
  right.forEach((n, i) => box.set(n.id, { x: 1524, y: 64 + i * 142, w: 240, h: 120 }));
  const stackY = { 0: 120, 1: 120, 2: 120, 3: 120, 4: 120 };
  for (const id of ["cli", "hooks", "skill", "skillmd", "init", "server", "speech"]) {
    const c = colOf[id], rows = functions.filter((f) => f.module === id);
